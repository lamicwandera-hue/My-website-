<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060d24;color:#e2e8f0;font-family:'Segoe UI',Arial,sans-serif;line-height:1.5}
.header{position:sticky;top:0;z-index:100;background:rgba(6,13,36,0.95);backdrop-filter:blur(10px);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d4af3720}
.logo{color:#d4af37;font-weight:900;letter-spacing:1px;font-size:15px}
.live-badge{background:#10b98120;color:#10b981;border:1px solid #10b98140;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700}
.hero-wrap{max-width:1000px;margin:14px auto;padding:0 14px}
.hero{border-radius:20px;overflow:hidden;border:2px solid #d4af37;box-shadow:0 10px 40px #0008;position:relative;background:#000}
.hero img{width:100%;height:auto;display:block}
.hero-badge{position:absolute;top:14px;left:14px;background:#d4af37;color:#000;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.btn{padding:14px 26px;border-radius:30px;text-decoration:none;font-weight:900;font-size:13px;display:inline-flex;align-items:center;justify-content:center;min-width:150px;transition:0.2s}
.btn-gold{background:linear-gradient(135deg,#d4af37,#f4d35e);color:#000;box-shadow:0 6px 18px #d4af3740}
.btn-green{background:#25D366;color:#fff;box-shadow:0 6px 18px #25d36640}
.btn-outline{background:transparent;color:#d4af37;border:2px solid #d4af37}
.btn:hover{transform:translateY(-2px)}
.section{max-width:1000px;margin:0 auto;padding:10px 14px}
.section-title{color:#d4af37;font-size:18px;font-weight:900;margin:22px 0 12px 4px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,#111e3d,#0e1730);border:1px solid #ffffff0f;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #0005}
.card-img{width:100%;height:180px;object-fit:cover;display:block;background:#000}
.card-body{padding:14px}
.card h3{color:#f8fafc;font-size:14px;font-weight:800}
.card .price{color:#d4af37;font-weight:900;font-size:12px;margin:4px 0}
.card p{color:#94a3b8;font-size:11px;margin:6px 0 10px}
.card-action{display:flex;gap:8px}
.mini-btn{flex:1;padding:9px;text-align:center;border-radius:20px;font-size:11px;font-weight:800;text-decoration:none}
.mini-gold{background:#d4af37;color:#000}
.mini-outline{background:transparent;border:1px solid #ffffff20;color:#cbd5e1}
.full-card{grid-column:1/-1}
.footer{background:#080f27;border-top:1px solid #ffffff0f;margin-top:28px;padding:22px 16px;text-align:center;color:#64748b;font-size:11px}
.footer b{color:#d4af37}
.whatsapp-float{position:fixed;bottom:18px;right:18px;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 8px 24px #25d36660;z-index:200}
</style>
</head>
<body>
